<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet · 美术资产目录</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#10151d;color:#e8edf4}*{box-sizing:border-box}body{margin:0}header,main{max-width:1440px;margin:auto;padding:32px}h1{font-size:32px;margin:8px 0}h2{font-size:21px}p{line-height:1.7;color:#afbdd0}a{color:#85cdff;overflow-wrap:anywhere}small{color:#a7b6c9}.eyebrow{color:#97e0c1;font-size:13px;letter-spacing:2px}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.stat{padding:16px 24px;border:1px solid #334155;border-radius:12px;background:#182130}.stat b{display:block;font-size:26px;color:#fafcff}.bar{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#10151df5;padding:14px 0;z-index:2}input,select,button{font:inherit;background:#202d3d;border:1px solid #455975;color:#fff;border-radius:8px;padding:10px}input{flex:1;min-width:220px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.card{background:#192331;border:1px solid #334155;border-radius:12px;overflow:hidden;min-width:0}.preview{height:200px;display:flex;align-items:center;justify-content:center;background-color:#293345;background-image:linear-gradient(45deg,#323f54 25%,transparent 25%),linear-gradient(-45deg,#323f54 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#323f54 75%),linear-gradient(-45deg,transparent 75%,#323f54 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{max-width:100%;max-height:100%;object-fit:contain}.body{padding:18px}.body h3{font-size:16px;line-height:1.5;margin:8px 0;overflow-wrap:anywhere}.path{font-size:12px;overflow-wrap:anywhere;color:#9eafc5;line-height:1.5}.badge{font-size:12px;color:#97e0c1}.card p{font-size:13px;margin:10px 0}details{margin:10px 0;font-size:13px}summary{cursor:pointer;color:#bfdbf5}ul{padding-left:20px;line-height:1.7}li{overflow-wrap:anywhere}.files{max-height:240px;overflow:auto}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #334155;text-align:left;padding:12px;white-space:nowrap}.note{background:#1b293a;padding:18px;border-radius:12px}.note li{margin-bottom:8px}#count{margin:10px 0 18px}footer{padding:30px 0;color:#afbdd0}@media(max-width:600px){header,main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:27px}.stat{padding:12px}}
</style>
<header><div class="eyebrow">PLANET / ART LIBRARY</div><h1>美术资产目录</h1><p>交付原件、项目已有素材与设计参考，按目录浏览。原始版本完整保留，游戏现用资源可追溯。</p><div id="stats" class="stats"></div><details class="note"><summary>整理范围与使用说明</summary><ul id="notes"></ul></details></header>
<main><h2>本次交付</h2><div class="tablewrap"><table><thead><tr><th>来源文件夹</th><th>有效文件</th><th>大小</th><th>与项目原件相同</th><th>归档目录</th></tr></thead><tbody id="packs"></tbody></table></div><h2>资产浏览</h2><div class="bar"><input id="query" type="search" placeholder="搜索：史莱姆、地鼠花、科技树、星球…" aria-label="搜索资产"><select id="scope" aria-label="范围"><option value="">全部范围</option><option>本次归档</option><option>项目已有</option></select><select id="category" aria-label="分类"><option value="">全部分类</option></select></div><p id="count"></p><div id="grid" class="grid"></div><footer><a href="inventory.json">完整清单与 SHA256 核对记录</a> · <span id="date"></span></footer></main>
<script>
const data=__CATALOG_DATA__;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=p=>'../../'+p.split('/').map(encodeURIComponent).join('/'), mb=n=>(n/1048576).toFixed(2)+' MB';
const link=p=>'<a href="'+url(p)+'" target="_blank" rel="noopener">'+esc(p)+'</a>';
const summary=data.summary;
$('stats').innerHTML=[[summary.pack_files,'交付文件'],[summary.reference_images,'本轮参考图'],[summary.existing_art_files,'项目已有美术文件'],[mb(summary.delivered_bytes),'归档总大小'],[summary.excluded_metadata_files,'已排除系统附带文件']].map(([n,s])=>'<div class="stat"><b>'+esc(n)+'</b><small>'+s+'</small></div>').join('');
$('notes').innerHTML=data.notes.map(n=>'<li>'+esc(n)+'</li>').join('');
$('packs').innerHTML=data.packs.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.files+'</td><td>'+mb(p.bytes)+'</td><td>'+p.exact_match_files+'</td><td>'+esc(p.destination)+'</td></tr>').join('');
$('date').textContent='整理时间：'+data.generated_at;
[...new Set(data.groups.map(g=>g.category))].forEach(c=>{const o=document.createElement('option');o.textContent=c;$('category').append(o)});
function details(title,items){return items.length?'<details><summary>'+title+'（'+items.length+'）</summary><ul class="files">'+items.map(p=>'<li>'+link(p)+'</li>').join('')+'</ul></details>':''}
function draw(){const q=$('query').value.trim().toLowerCase(), scope=$('scope').value, cat=$('category').value;const groups=data.groups.filter(g=>(!q||(g.folder+' '+g.pack).toLowerCase().includes(q))&&(!scope||scope===g.scope)&&(!cat||cat===g.category));$('count').textContent=groups.length+' 个目录 · '+groups.reduce((n,g)=>n+g.count,0)+' 个文件';$('grid').innerHTML=groups.map(g=>'<article class="card"><div class="preview">'+(g.preview?'<a href="'+url(g.preview)+'" target="_blank" rel="noopener" style="display:contents"><img loading="lazy" src="'+url(g.preview)+'" alt="'+esc(g.folder.split('/').slice(-1)[0])+'"></a>':'<span>字体 / 着色器 / 附带文件</span>')+'</div><div class="body"><span class="badge">'+esc(g.scope)+' · '+esc(g.category)+'</span><h3>'+esc(g.folder.split('/').slice(-2).join(' / '))+'</h3><div class="path">'+esc(g.folder)+'</div><p>'+g.count+' 个文件 · '+mb(g.bytes)+'<br>'+esc(g.sizes.join(' / '))+'</p>'+details('文件列表',g.files)+details('项目中完全相同的原件',g.exact_matches)+details('场景 / 资源 / 脚本静态引用',g.referenced_by)+'</div></article>').join('')}
['query','scope','category'].forEach(id=>$(id).addEventListener('input',draw));draw();
</script></html>
